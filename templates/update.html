{% extends 'base.html' %}
{% block body %}
    
<div class="container my-2">
    <h3>Update Todo</h3>
    <form action="/update/{{todo.sno}}" method="POST">
  <div class="mb-3">
    <label for="title" class="form-label">todo title</label>
    <input type="text" class="form-control" name="title" id="title" value="{{todo.title}}" aria-activedescendant="emailHelp">
  </div>
  <div class="mb-3">
    <label for="desc" class="form-label">todo description</label>
    <input type="text" class="form-control" name="desc" id="desc" value="{{todo.desc}}">
  </div>
  <button type="submit" class="btn btn-primary">update</button>
</form></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  {% endblock body %}
